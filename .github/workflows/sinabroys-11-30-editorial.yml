name: Replace SinaBroys 11-30 images with individual editorial designs
on:
  push:
    branches: [main]
    paths:
      - 'tools/sinabroys_11_30_editorial.py'
      - '.github/workflows/sinabroys-11-30-editorial.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sinabroys-editorial-11-30
  cancel-in-progress: false
jobs:
  render-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependencies in isolated CI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow
      - name: Backup existing 11-30 images without overwriting backups
        shell: bash
        run: |
          set -euo pipefail
          src=media/images/sinabroys/20261110
          bak=media/images/sinabroys/20261110_archive_original_11_30
          mkdir -p "$bak"
          for i in $(seq -w 11 30); do
            shopt -s nullglob
            matches=("$src/$i"_*.png)
            if [ "${#matches[@]}" -ne 1 ]; then echo "Expected exactly one source for $i"; exit 1; fi
            f="${matches[0]}"
            if [ ! -f "$bak/${f##*/}" ]; then cp "$f" "$bak/${f##*/}"; fi
          done
      - name: Render editorial redesign images 11-30
        run: python tools/sinabroys_11_30_editorial.py
      - name: Verify 20 images, exact filenames, dimensions and hashes
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          p=Path('media/images/sinabroys/20261110')
          items=json.loads((p/'manifest_11_30_editorial.json').read_text())
          assert len(items)==20
          for n,it in enumerate(items,11):
              assert it["id"]==f"{n:02d}"
              path=p/it["file"]
              assert path.name.startswith(f"{n:02d}_")
              assert hashlib.sha256(path.read_bytes()).hexdigest()==it["sha256"]
              with Image.open(path) as image:
                  assert image.size==(1200,1500) and image.format=="PNG"
                  image.verify()
          print("[VERIFIED] 20/20 PNG images")
          PY
      - name: Commit output images, QA thumbnails and backups
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/images/sinabroys/20261110 media/images/sinabroys/20261110_archive_original_11_30
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "media: replace 11-30 with varied editorial onepagers"
            git push origin HEAD:main
          fi
